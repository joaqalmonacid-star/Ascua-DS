name = "ascua"
main = "api/src/index.js"
compatibility_date = "2024-11-01"

# Este archivo esta en la RAIZ a proposito.
#
# Cloudflare ejecuta el deploy desde la raiz del repositorio, y si wrangler no
# encuentra un wrangler.toml aqui, se genera uno que toma la raiz entera como
# directorio de assets. Eso sube el node_modules/workerd de 128 MB y el deploy
# falla con "Asset too large".
#
# Que este en la raiz hace que `npx wrangler deploy` funcione sin paso previo:
# no hace falta preparar nada, ni build command, ni script de copia.
[assets]
directory = "./public"
# Sin esto, /api/* se buscaria como archivo y devolveria 404 en vez de llegar
# al Worker.
run_worker_first = ["/api/*"]

# Base de datos de pedidos y precios de referencia. El Worker cobra desde esta
# tabla, nunca desde public/data/productos.json.
[[d1_databases]]
binding = "DB"
database_name = "ascua"
# Crear con:  npx wrangler d1 create ascua
# y pegar aqui el id que devuelve.
database_id = "REEMPLAZAR_CON_EL_ID_DE_TU_D1"

[vars]
# Origen del sitio: se usa para las URLs de retorno del pago. En produccion
# pon el dominio real, porque es lo que la pasarela usa para volver.
ORIGEN = "http://localhost:5173"
# Direccion de contacto del comprador (remitente).
EMAIL_REMITENTE = "Ascua <hola@ascua.test>"
EMAIL_NOTIFICACIONES = "hola@ascua.test"
# Datos fiscales que aparecen en la factura.
RAZON_SOCIAL = "Ascua"
RUT = "PENDIENTE"
DOMICILIO = "PENDIENTE"
# El sitio y la API se sirven desde el mismo dominio, asi que no hace falta
# CORS. Si los separas algun dia, pon aqui el dominio del sitio, por ejemplo
# "https://ascua.cl", y solo ese origen tendra permiso.
# CORS_ORIGIN = ""

# Secrets (nunca van en este archivo):
#   wrangler secret put MP_ACCESS_TOKEN
#   wrangler secret put MP_WEBHOOK_SECRET
#   wrangler secret put FLOW_API_KEY
#   wrangler secret put FLOW_SECRET_KEY
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put CLAVE_PANEL